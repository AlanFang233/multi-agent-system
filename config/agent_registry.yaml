# Developer-controlled local Agent registry (not an MCP server registry).
# NOTE: this file previously contained two top-level `agents:` keys; PyYAML kept
# only the second (capability-based) block, so the first block was dead config
# and has been removed without behavior change.
agents:
  research:
    url: http://127.0.0.1:8001
    description: Research, web search, evidence verification
    capabilities:
      - web_search
      - evidence_synthesis
      - documentation_research

  coding:
    url: http://127.0.0.1:8002
    description: Software development and Python debugging
    capabilities:
      - git_audit
      - python_debugging
      - sandbox_execution
      - file_editing

  analysis:
    url: http://127.0.0.1:8003
    description: Statistics and numerical analysis
    capabilities:
      - statistics
      - loss_metrics
      - numerical_analysis

policy:
  max_hops: 2
  max_delegations_per_task: 3
  timeout_seconds: 120
