# Developer-controlled local Agent registry (not an MCP server registry).
agents:
  research:
    url: http://127.0.0.1:8001
    description: 文献研究、信息检索、综合报告
  coding:
    url: http://127.0.0.1:8002
    description: Git 状态检查、代码分析、软件开发
  analysis:
    url: http://127.0.0.1:8003
    description: 数据统计、指标计算、数值分析

# Begin with a DAG: research can call coding. This prevents endless ping-pong.
# Once Analysis Agent is running, allow research: [coding, analysis],
# and optionally coding: [analysis]. Avoid cycles.

agents:
  research:
    url: http://127.0.0.1:8001
    description: Research, web search, evidence verification
    capabilities:
      - web_search
      - evidence_synthesis
      - documentation_research

  coding:
    url: http://127.0.0.1:8002
    description: Software development and Python debugging
    capabilities:
      - git_audit
      - python_debugging
      - sandbox_execution
      - file_editing

  analysis:
    url: http://127.0.0.1:8003
    description: Statistics and numerical analysis
    capabilities:
      - statistics
      - loss_metrics
      - numerical_analysis

policy:
  max_hops: 2
  max_delegations_per_task: 3
  timeout_seconds: 120

    