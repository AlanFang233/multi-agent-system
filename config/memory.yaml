
# config/memory.yaml

database: data/agent_memory.sqlite

# 输入字符预算（不是 Token）
max_input_chars: 128000

# 约达到 75% 时压缩旧上下文
compact_trigger_chars: 96000

# 保留最近 4 组工具交互
keep_recent_groups: 10

# 压缩摘要最多 6000 字符
summary_chars: 24000

# 每次工具结果最多预览 3000 字符
max_tool_preview_chars: 8000

# 最多检索 4 条长期记忆
memory_retrieval_limit: 10
  