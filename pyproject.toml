[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agent-ecosystem"
version = "0.1.0"
description = "Local-first multi-agent starter with A2A, MCP, cloud LLM API, and infrastructure"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "starlette>=0.46,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "httpx>=0.28,<1",
    "mcp>=2,<3",
    "mcp-server-git>=2026.11.11",
    "mcp-server-fetch>=2026.11.11",
    "a2a-sdk>=1,<2",
    "langgraph>=1,<2",
    "langgraph-checkpoint-postgres>=3,<4",
    "openai>=2,<4",
    "sqlalchemy[asyncio]>=2,<3",
    "asyncpg>=0.30,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "alembic>=1.15,<2",
    "pgvector>=0.4,<1",
    "redis>=5,<8",
    "pyyaml>=6,<7",
    "jsonschema>=4,<5",
    "packaging>=24,<27",
    "tenacity>=9,<10",
    "structlog>=25,<27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<2",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_ecosystem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
